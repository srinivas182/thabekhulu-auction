# CI per ADR 0002: lean checks on draft PRs, the full suite once a PR is
# ready for review, nothing on push to main (already tested in the PR).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quick:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: intl, zip, bcmath, pcntl, gd, redis
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Route type generation reads model key types from the schema, so
      # migrate a throwaway SQLite database first (matches local machines).
      - name: Prepare environment
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci.sqlite
          CACHE_STORE: array # no Redis in this job
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/ci.sqlite
          php artisan migrate --force --no-interaction
          php artisan wayfinder:generate --with-form

      - name: PHP code style (Pint)
        run: vendor/bin/pint --test

      - name: PHP static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Front-end lint and format
        run: npm run check

      - name: TypeScript
        run: npm run types:check

  full:
    name: Tests and build
    if: github.event.pull_request.draft == false
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      EXPECTED_DB_DRIVER: mysql

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: intl, zip, bcmath, pcntl, gd, redis, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build front end (client and SSR)
        run: npm run build:ssr

      - name: Tests (Pest on MySQL 8.4)
        run: vendor/bin/pest --parallel
